name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Prepare blog compatibility pages
        run: python scripts/build_blog.py prepare --docs-dir docs --output-dir .build/docs

      - name: Build with Zensical
        run: zensical build --config-file mkdocs.zensical.yml --clean --strict

      - name: Finalize blog compatibility pages
        run: python scripts/build_blog.py finalize --docs-dir docs --site-dir site

      - name: Generate AI documentation
        run: python scripts/generate_ai_docs.py --config-file mkdocs.yml --output-dir site

      - name: Validate Pages output
        run: python scripts/validate_site.py --config-file mkdocs.yml --site-dir site

      - name: Compare production URLs
        run: python scripts/compare_production_urls.py --manifest tests/production-url-manifest.json --site-dir site

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
